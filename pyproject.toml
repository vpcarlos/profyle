[project]
name = "profyle"
version = "0.3.0"
description = "Profyle, a development tool for analysing and managing python traces"
authors = [{ name = "Carlos Valdivia", email = "vpcarlos97@gmail.com" }]
maintainers = [{ name = "Carlos Valdivia", email = "vpcarlos97@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<4.0"
classifiers = [
    "Framework :: FastAPI",
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["cprofile", "devtool", "perffeto", "profyle", "viztracer", "fastapi", "flask"]
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.2",
    "uvicorn[standard]>=0.39.0",
    "viztracer>=1.0.0",
]

[project.urls]
Repository = "https://github.com/vpcarlos/profyle"

[project.scripts]
profyle = "profyle.main:run"

[project.optional-dependencies]
flask = [
    "flask>=2.0.0",
]
django = [
    "django>=4.2.7",
]
fastapi = [
    "fastapi>=0.115.0",
]
# MCP server so Claude Code / Claude Desktop can query traces (`profyle mcp`)
mcp = [
    "mcp>=1.10.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.0.1",
    "pytest>=7.2.1",
    "httpx>=0.23.3",
    "flask>=2.0.0",
    "django>=4.2.7",
    "mcp>=1.10.0",
    "pytest-asyncio>=0.21.1",
    "ruff>=0.1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",
]

ignore = [
    # Avoid trying to fix flake8-bugbear (`B`) violations.
    "B",
    "E731",
]

fix = true
unfixable = []

line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
